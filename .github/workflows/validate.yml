name: Structural validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate canonical structure and overlays
        run: python scripts/validate_data.py
      - name: Run dependency-free project tests
        run: python scripts/test_project.py
      - name: Parse JSON artifacts
        run: |
          python -m json.tool data/hokkaido_places_master.json > /dev/null
          python -m json.tool data/candidate_locations.json > /dev/null
          python -m json.tool data/research_batches_level1.json > /dev/null
          python -m json.tool data/planner_overlay_20260811.json > /dev/null
      - name: Check JavaScript syntax
        run: |
          node --check web/data-adapter.js
          node --check web/app.js
          node --check web/google-maps-loader.js
          node --check web/planner-enhancements.js
          node --check web/planner-custom-types.js
          node --check web/planner-runtime-fixes.js
          node --check web/planner-itinerary-ui.js
      - name: Test itinerary UI helpers
        run: node scripts/test_planner_itinerary_ui.mjs
      - name: Test NAVITIME route adapter
        run: node scripts/test_navitime_adapter.mjs
